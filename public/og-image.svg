<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!--
    OG Image for social sharing - 1200x630px
    Brand colors: Olera Teal palette per Manual Ch 4.2.2
  -->
  <rect width="1200" height="630" fill="#F0FDFA"/>

  <!-- Background pattern with teal -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="5" r="2" fill="#CCFBF1" opacity="0.7"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Main content area -->
  <rect x="100" y="100" width="1000" height="430" rx="20" fill="white" opacity="0.95"/>

  <!-- Bird logo (scaled version of bird-logo.svg) -->
  <g transform="translate(220, 235) scale(5)">
    <path d="M6 26 Q2 22, 6 16 Q10 10, 18 6 Q22 4, 26 6 Q22 10, 16 14 Q10 18, 8 24 Q7 26, 6 26 Z" fill="#0D9488"/>
    <path d="M14 10 Q18 8, 22 10 Q18 12, 14 12 Q12 11, 14 10 Z" fill="#0F766E"/>
  </g>

  <!-- Text -->
  <text x="450" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#111827">
    Olera
  </text>
  <text x="450" y="340" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="36" fill="#0D9488">
    Find the Perfect Care
  </text>
  <text x="450" y="395" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" fill="#6B7280">
    Connect with trusted senior living providers
  </text>
</svg>
