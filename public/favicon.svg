<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Olera Favicon — Geometric teal hummingbird
  -->
  <!-- Body / torso -->
  <polygon points="16,25 13.5,18.5 17.2,16.2 19,19.4" fill="#0D9488"/>
  <polygon points="16,25 19,19.4 20,21.2" fill="#0F766E"/>

  <!-- Head -->
  <polygon points="17.2,16.2 19.3,14 20.2,16 19,17.2" fill="#0D9488"/>
  <polygon points="19.3,14 20.9,13.1 20.2,16" fill="#0F766E"/>

  <!-- Beak -->
  <polygon points="19.3,14 20.9,13.1 21.8,11.9" fill="#115E59"/>

  <!-- Left wing -->
  <polygon points="13.5,18.5 7.5,11 11.9,13.8 14.7,16.5" fill="#14B8A6"/>
  <polygon points="7.5,11 5,6.9 10,10.3 11.9,13.8" fill="#0D9488"/>
  <polygon points="5,6.9 3.5,3.8 8.1,7.8 10,10.3" fill="#0F766E"/>
  <polygon points="3.5,3.8 2.7,1.5 6.2,5.2 8.1,7.8" fill="#115E59"/>

  <!-- Right wing -->
  <polygon points="19,17.2 25,10 21.9,13.5 19.7,16.2" fill="#14B8A6"/>
  <polygon points="25,10 27.8,6.2 23.8,9.8 21.9,13.5" fill="#0D9488"/>
  <polygon points="27.8,6.2 29.8,3.5 26.2,7.2 23.8,9.8" fill="#0F766E"/>
  <polygon points="29.8,3.5 30.5,1.9 28.5,5 26.2,7.2" fill="#115E59"/>

  <!-- Tail -->
  <polygon points="16,25 13.8,28.8 15,26.9 16.9,28.1" fill="#0F766E"/>
  <polygon points="16,25 16.9,28.1 18.1,29.4 17.5,26.2" fill="#115E59"/>

  <!-- Wing highlights -->
  <polygon points="7.5,11 10,10.3 11.9,13.8" fill="#2DD4BF" opacity="0.3"/>
  <polygon points="25,10 23.8,9.8 21.9,13.5" fill="#2DD4BF" opacity="0.3"/>
</svg>
